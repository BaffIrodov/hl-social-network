spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/social_network_test}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
    hikari:
      minimum-idle: 0
      maximum-pool-size: ${TEST_DB_MAX_POOL_SIZE:4}
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
      database: ${TEST_REDIS_DATABASE:15}
app:
  feed:
    worker-enabled: false

name: Java 21 and PostgreSQL tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: social_network_test
          POSTGRES_USER: social_network
          POSTGRES_PASSWORD: local_password
        ports:
          - 5433:5932
        options: >-
          --health-cmd "pg_isready -U social_network -d social_network_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -Pintegration-test verify

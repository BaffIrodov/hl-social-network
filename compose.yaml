services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: social_network
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_password}
    ports:
      - "${DB_PORT:-5932}:5932"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5932/social_network
      DB_USERNAME: social_network
      DB_PASSWORD: ${DB_PASSWORD:-local_password}
      TOKEN_TTL: ${TOKEN_TTL:-6h}
    depends_on:
      db:
        condition: service_healthy

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: social_network_test
      POSTGRES_USER: social_network
      POSTGRES_PASSWORD: local_password
    ports:
      - "5433:5932"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
